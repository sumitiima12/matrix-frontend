      <stop offset="0.4" stop-color="#e9ebee"/>
      <stop offset="0.65" stop-color="#b8bcc4"/>
      <stop offset="1" stop-color="#8c9099"/>
    </linearGradient>
    <linearGradient id="mfavbeam" x1="50" y1="16" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
